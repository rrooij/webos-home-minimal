# webos-home-minimal configuration
#
# blacklist = <app id pattern>   hide matching apps; may be repeated.
#                                Shell-style wildcards work: * ? [...]
# sort      = title              sort alphabetically (default: launcher order)
# position  = center|top|bottom  vertical position of the icons (default: center)
# luna_send = <binary>           luna client to use (default: try luna-send,
#                                then luna-send-pub)
# use_hbchannel = true|false     when direct calls are denied (the app runs
#                                jailed), run them as root through the
#                                Homebrew Channel service. Rooted TVs only.
#                                Default: true
#
# Tip: list the ids on your TV with
#   luna-send -n 1 -f luna://com.webos.service.applicationmanager/listApps '{}' | grep '"id"'

# blacklist = com.webos.app.discovery      # LG Content Store
# blacklist = com.webos.app.livetv
# blacklist = com.webos.app.hdmi*          # all HDMI inputs
# sort = title
# position = center
blacklist = com.webos.app.discovery      # LG Content Store
blacklist = amazon.*
